<!doctype html>
<html lang="en-AU"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TWS Job Board</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16202b">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#eef1f4;--panel:#fff;--sunk:#e3e8ee;--line:#cfd6de;--fg:#16202b;--muted:#5a6876;
  --accent:#1f5fd1;--ink:#fff;--hi:#f0a020;
  --amber:#b86e00;--amber-bg:#fff1d6;--good:#1c7a46;--good-bg:#dcf3e5;--bad:#b4302a;--bad-bg:#fbe3e1;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{
  --bg:#11161c;--panel:#19212a;--sunk:#0d1217;--line:#2b3642;--fg:#e6ebf0;--muted:#93a1af;--accent:#5b93f5;--ink:#0b1320;
  --amber:#f0b350;--amber-bg:#3a2a0e;--good:#5fd394;--good-bg:#12311f;--bad:#f2837c;--bad-bg:#3d1a18;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-left,0px)) 0 max(14px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:5;background:#16202b;color:#fff;padding-top:env(safe-area-inset-top,0px)}
.hrow{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{font:700 22px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0}
.brand small{display:block;font:500 10px var(--body);letter-spacing:.1em;color:#9fb0c0}
.hrow .sp{flex:1}
.who{font-size:12px;color:#c9d4de;text-align:right}
.who a{color:#fff}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;min-width:0;background:none;border:0;padding:9px 2px 8px;font:600 11px var(--body);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button span{font-size:19px;line-height:1}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
nav.tabs button{position:relative}
.nb{position:absolute;top:4px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font:700 10px/17px var(--body);font-style:normal}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;position:relative}
.tile .ic{font-size:26px}.tile b{font:700 19px var(--display);text-transform:uppercase;letter-spacing:.03em}
.tile .nb{top:10px;left:auto;right:10px}
main{padding-block:14px 30px}
h2.v{font:700 22px var(--display);text-transform:uppercase;letter-spacing:.03em;margin:4px 0 10px}
h3{font:600 17px var(--display);text-transform:uppercase;letter-spacing:.04em;margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn.go{background:var(--good);border-color:var(--good);color:#fff}
.btn.stop{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.big{font-size:20px;padding:16px;border-radius:12px;width:100%;font-family:var(--display);letter-spacing:.04em;text-transform:uppercase}
.btn.small{padding:4px 10px;font-size:12px}
.btn.link{border:0;background:none;color:var(--accent);padding:4px}
.btn:disabled{opacity:.55;cursor:default}
.btn.danger{color:var(--bad)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
label.f input,label.f select,label.f textarea,.in{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:400;text-transform:none;letter-spacing:0;color:var(--fg);width:100%;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.row > label{flex:1 1 110px}
.muted{color:var(--muted)}.small{font-size:12px}
.code{font:500 11px var(--mono);color:var(--accent);white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--amber-bg);color:var(--amber)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.notice{padding:10px 12px;border-radius:8px;background:var(--amber-bg);color:var(--amber);font-weight:500;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--sunk);border-radius:8px;padding:8px 10px}
.stat b{display:block;font:500 17px var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat.good b{color:var(--good)}.stat.bad b{color:var(--bad)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.over i{background:var(--bad)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.num{text-align:right;white-space:nowrap}
/* clock */
.clock{text-align:center;gap:12px}
.clock .big{font:700 46px/1 var(--mono);font-variant-numeric:tabular-nums}
.clock .job{font:700 24px/1.1 var(--display);text-transform:uppercase}
/* jobs */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .sp{flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.card.Active{border-left-color:var(--good)}.card.Planned{border-left-color:var(--accent)}.card[class*="hold"]{border-left-color:var(--amber)}
.card .t{font-weight:600;font-size:15px}
.card .m{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px}
.grp{font:600 13px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 2px}
/* calendar */
.cal{display:grid;gap:6px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day h4{margin:0 0 6px;font:600 15px var(--display);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between}
.ppl{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px}
.cell{background:var(--sunk);border-radius:8px;padding:6px;min-height:46px;display:flex;flex-direction:column;gap:4px;cursor:default}
.cell.me{outline:2px solid var(--hi)}
.cell.can{cursor:pointer}
.cell .nm{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase}
.chip{font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 6px;line-height:1.25}
.chip b{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:500}
.act{font-size:11px;color:var(--good);font-weight:600}
/* plan checklist */
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.plan li{display:flex;gap:8px;align-items:center;padding:6px 8px;background:var(--sunk);border-radius:8px}
.plan li.dn span{text-decoration:line-through;color:var(--muted)}
.plan li span{flex:1}
.plan input[type=checkbox]{width:20px;height:20px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,10,15,.5);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--bg);z-index:21;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) 16px;display:flex;flex-direction:column;gap:12px}
.shead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.shead h2{font:700 28px/1.05 var(--display);margin:2px 0 0;text-transform:uppercase}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;font-weight:500;max-width:90vw}
/* tickets */
.tk{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.tk > div{flex:1;min-width:0}
.tk .ex{font:500 12px var(--mono);white-space:nowrap}
.due{display:block;padding:10px 12px;border-radius:8px;margin-bottom:12px;font-weight:500;background:var(--amber-bg);color:var(--amber)}
.due.bad{background:var(--bad-bg);color:var(--bad)}
/* photos */
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.ph button.th{padding:0;border:0;border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--sunk);cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph label.add{aspect-ratio:1;border:2px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;gap:2px}
.ph label.add span{font-size:22px}
.ph label.add input{display:none}
.pstage{font:600 13px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 0 2px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px));color:#fff}
.viewer img{max-width:100%;max-height:78vh;border-radius:6px}
/* gate */
#gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center;background:#16202b;color:#fff}
#gate img{width:96px;height:96px;border-radius:20px}
#gate p{max-width:360px;color:#c9d4de}
.mem{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.mem > div{flex:1 1 160px}
</style>
</head><body>

<div id="gate">
  <img src="icon-192.png" alt="">
  <h1 class="brand" style="font-size:28px">Total Welding Solutions<small>JOB BOARD</small></h1>
  <p id="gateMsg">Loading…</p>
  <button class="btn primary big" id="signIn" style="max-width:320px" hidden>Sign in with Google</button>
  <a href="#" id="gateOut" class="small" style="color:#9fb0c0" hidden>Sign out</a>
</div>

<div id="app" hidden>
<header><div class="wrap hrow">
  <h1 class="brand">TWS<small>JOB BOARD</small></h1>
  <span class="sp"></span>
  <div class="who"><span id="meName"></span><br><a href="#" id="signOut">Sign out</a></div>
</div></header>

<main class="wrap">
  <div id="note" class="notice" hidden></div>

  <!-- CLOCK -->
  <section id="v-clock"></section>

  <!-- JOBS -->
  <section id="v-jobs" hidden>
    <div class="toolbar">
      <input class="in" id="q" type="search" placeholder="Search jobs, sites, clients" style="flex:1 1 200px;width:auto">
      <button class="btn primary mgr" id="newJob">+ New job</button>
    </div>
    <div id="jobList"></div>
  </section>

  <!-- CALENDAR -->
  <section id="v-cal" hidden>
    <div class="toolbar">
      <button class="btn small" id="cPrev" aria-label="Previous week">‹</button>
      <h2 class="v" id="cLabel" style="margin:0;flex:1;text-align:center"></h2>
      <button class="btn small" id="cNext" aria-label="Next week">›</button>
    </div>
    <p class="muted small mgr" style="margin:0 0 8px">Tap a box to put someone on a job for that day. Green ticks are hours actually clocked.</p>
    <div class="cal" id="calGrid"></div>
  </section>

  <!-- TICKETS -->
  <section id="v-tix" hidden></section>

  <!-- IDEAS -->
  <section id="v-ideas" hidden></section>

  <section id="v-fix" hidden></section>
  <section id="v-buy" hidden></section>
  <section id="v-more" hidden></section>

  <!-- MANAGER -->
  <section id="v-mgr" hidden></section>
</main>

<nav class="tabs" role="tablist">
  <button data-v="clock" aria-selected="true"><span>⏱</span>Clock</button>
  <button data-v="jobs" aria-selected="false"><span>🔧</span>Jobs</button>
  <button data-v="cal" aria-selected="false"><span>📅</span>Calendar</button>
  <button data-v="more" aria-selected="false"><span>☰</span>More<i id="moreBadge" class="nb" hidden></i></button>
</nav>
</div>

<div id="sheetRoot"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
/* ============ helpers ============ */
const OWNERS=(window.OWNERS||[]).map(s=>s.toLowerCase());
const DEFAULT_CREW=window.DEFAULT_CREW||["Luke"];
const STATUSES=["Active","Planned","On hold","Done"];
const BIZ="TWS";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const r2=n=>Math.round((+n||0)*100)/100;
const hf=n=>String(r2(n));
const money=n=>(n<0?"-$":"$")+Math.abs(+n||0).toLocaleString("en-AU",{maximumFractionDigits:0});
const money2=n=>"$"+(+n||0).toLocaleString("en-AU",{minimumFractionDigits:2,maximumFractionDigits:2});
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function fmtD(s){if(!s)return"";const[y,m,d]=s.split("-");return new Date(+y,m-1,+d).toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"})}
const fmtT=iso=>iso?new Date(iso).toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit"}):"";
const hm=iso=>{const d=new Date(iso);return pad(d.getHours())+":"+pad(d.getMinutes())};
function elapsed(iso){const m=Math.max(0,Math.floor((Date.now()-new Date(iso))/60000));return Math.floor(m/60)+":"+pad(m%60)}
function toast(t,ms){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,ms||2400)}
function note(t){$("note").textContent=t||"";$("note").hidden=!t}
function dist(a,b){const R=6371000,k=Math.PI/180,dl=(b.lat-a.lat)*k,dn=(b.lng-a.lng)*k;const h=Math.sin(dl/2)**2+Math.cos(a.lat*k)*Math.cos(b.lat*k)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function getLoc(){return new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)}),()=>res(null),{enableHighAccuracy:true,timeout:12000,maximumAge:60000})})}
function parseLatLng(s){s=String(s||"");const m=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);return m?{lat:+(+m[1]).toFixed(6),lng:+(+m[2]).toFixed(6)}:null}
function hasLoc(j){return j&&typeof j.lat==="number"&&typeof j.lng==="number"}
function locInfo(loc,j){if(!loc)return{none:true};const r={...loc};if(hasLoc(j)){r.dist=Math.round(dist(loc,j));r.onSite=r.dist<=(+j.radius||300)}return r}
function locPill(l){if(!l||l.none)return`<span class="pill warn">no GPS</span>`;if(l.onSite===true)return`<span class="pill ok">on site</span>`;if(l.onSite===false)return`<span class="pill bad">${l.dist>=1000?(l.dist/1000).toFixed(1)+" km":l.dist+" m"} away</span>`;return`<span class="pill">GPS saved</span>`}
function mapsUrl(j){if(hasLoc(j))return`https://www.google.com/maps/search/?api=1&query=${j.lat},${j.lng}`;if(j.address)return`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(j.address)}`;return""}

/* ============ state ============ */
firebase.initializeApp(window.FIREBASE_CONFIG);
const auth=firebase.auth(),db=firebase.firestore();
try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
const S={user:null,me:null,role:null,access:{},reqs:[],tix:[],ideas:[],fix:[],buy:[],photos:[],jobs:[],shifts:[],cons:[],cal:[],money:{},rates:{labourCost:0,chargeRate:0},
  view:"clock",calWeek:monday(new Date()),mgrWeek:monday(new Date()),open:null,pick:null,loaded:{},seeded:false};
let subs=[];
const myEmail=()=>(S.user&&S.user.email||"").toLowerCase();
const isOwner=()=>OWNERS.includes(myEmail());
const isMgr=()=>isOwner()||S.role==="manager";
const job=id=>S.jobs.find(j=>j.id===id);
const jobName=id=>{const j=job(id);return j?`${j.code} ${j.title}`:"(deleted job)"};
function people(){const n=Object.values(S.access).map(m=>m.name).filter(Boolean);const all=[...new Set([...DEFAULT_CREW,...n])];return all}
const openJobs=()=>S.jobs.filter(j=>j.status!=="Done").sort((a,b)=>STATUSES.indexOf(a.status)-STATUSES.indexOf(b.status)||String(a.code).localeCompare(b.code));
const jobHrs=id=>S.shifts.filter(s=>s.jobId===id&&s.hours!=null).reduce((a,s)=>a+(+s.hours||0),0);
const expHrs=id=>+((S.money[id]||{}).expectedHrs)||0;
const jobCons=id=>S.cons.filter(c=>c.jobId===id).reduce((a,c)=>a+(+c.cost||0),0);
const myOpen=()=>S.shifts.find(s=>s.email===myEmail()&&!s.off);
function nextCode(){let m=0;S.jobs.forEach(j=>{const n=parseInt(String(j.code||"").replace(/\D/g,""),10);if(n>m)m=n});return"TWS-"+String(m+1).padStart(4,"0")}
function fail(err){console.warn(err);toast(err&&err.code==="permission-denied"?"You don't have permission to change that.":"That didn't save. Check your signal and try again.",4000)}

/* ============ daily totals (for the owner dashboard) ============ */
async function recompute(date){
  if(!date)return;
  try{
    const [sh,co]=await Promise.all([db.collection("shifts").where("date","==",date).get(),db.collection("consumables").where("date","==",date).get()]);
    const t={business:BIZ,date,hours:0,hoursByJob:{},hoursByWho:{},consumables:0,consumablesByJob:{},jobs:{},shifts:0,updatedAt:new Date().toISOString()};
    sh.forEach(d=>{const x=d.data();if(x.hours==null)return;const h=+x.hours||0;t.hours+=h;t.shifts++;
      t.hoursByJob[x.jobCode]=r2((t.hoursByJob[x.jobCode]||0)+h);t.hoursByWho[x.who]=r2((t.hoursByWho[x.who]||0)+h);t.jobs[x.jobCode]=x.site||""});
    co.forEach(d=>{const x=d.data();const c=+x.cost||0;t.consumables+=c;t.consumablesByJob[x.jobCode]=r2((t.consumablesByJob[x.jobCode]||0)+c);t.jobs[x.jobCode]=x.site||""});
    t.hours=r2(t.hours);t.consumables=r2(t.consumables);
    await db.doc("totals/"+date).set(t);

/* ---------- CLOCK ---------- */
function todaysPick(){const t=ymd(new Date());const a=S.cal.find(c=>c.date===t&&c.who===S.me&&job(c.jobId));if(a)return a.jobId;
  const last=S.shifts.filter(s=>s.email===myEmail()).sort((a,b)=>String(b.on).localeCompare(a.on))[0];if(last&&job(last.jobId)&&job(last.jobId).status!=="Done")return last.jobId;return""}
function renderClock(){
  const el=$("v-clock");if(el.contains(document.activeElement)&&document.activeElement.tagName!=="BUTTON")return;
  const o=myOpen();
  const wk=monday(new Date()),a=ymd(wk),b=ymd(addDays(wk,6));
  const mine=S.shifts.filter(s=>s.email===myEmail()&&s.date>=a&&s.date<=b).sort((x,y)=>String(y.on).localeCompare(x.on));
  const tot=mine.reduce((t,s)=>t+(+s.hours||0),0);
  let h=dueBanner(S.tix.filter(x=>x.who===S.me));
  if(o){const j=job(o.jobId)||{};
    const long=(Date.now()-new Date(o.on))/36e5>14;
    h+=`<div class="panel clock"><span class="pill ok" style="align-self:center">ON THE CLOCK</span>
      <div class="code">${esc(o.jobCode)}</div><div class="job">${esc(j.title||o.site)}</div>
      <div class="big" id="elapsed">${elapsed(o.on)}</div>
      <div class="muted">Since ${fmtT(o.on)} ${fmtD(o.date)} · ${locPill(o.onLoc)}</div>
      ${long?`<div class="notice" style="margin:0">Still on from ${fmtD(o.date)}? If you forgot to clock off, clock off now and tell Luke the real finish time.</div>`:""}
      <div class="row"><label class="f">Unpaid break (min)<input type="number" id="brk" min="0" step="5" value="${esc(o.breakMin||30)}" inputmode="numeric"></label>
      <label class="f" style="flex-basis:180px">Note (optional)<input id="cNote" value="${esc(o.note||"")}" placeholder="What you got done"></label></div>
      <button class="btn stop big" id="clockOff">Clock off</button>
      <button class="btn link" data-open="${esc(o.jobId)}">Open job card</button></div>`;
  }else{
    const pick=S.pick??todaysPick();const js=openJobs();
    h+=`<div class="panel clock"><span class="pill" style="align-self:center">NOT CLOCKED ON</span>
      ${js.length?`<label class="f" style="text-align:left">Job<select id="cJob"><option value="">Choose job…</option>${js.map(j=>`<option value="${esc(j.id)}" ${j.id===pick?"selected":""}>${esc(j.code+" · "+j.title)}</option>`).join("")}</select></label>
      <button class="btn small" id="findSite" style="align-self:center">📍 Find my site</button>
      <button class="btn go big" id="clockOn">Clock on</button>`:`<p class="muted">No jobs yet. ${isMgr()?"Add one under Jobs.":"Ask Luke to add the job."}</p>`}
      <div class="muted small">Your location is saved when you clock on and off, to check you're on site.</div></div>`;
  }
  const cj=o?o.jobId:(S.pick??todaysPick());
  if(cj&&job(cj))h+=consForm(cj,"Add consumables to "+job(cj).code);
  h+=`<div class="panel"><div class="row" style="justify-content:space-between;align-items:center"><h3>My hours this week</h3><b class="code" style="font-size:15px">${hf(tot)} h</b></div>
    ${mine.length?`<div class="tbl"><table><tbody>${mine.map(s=>`<tr><td>${fmtD(s.date)}<br><span class="muted small">${fmtT(s.on)}–${s.off?fmtT(s.off):"now"}</span></td><td>${esc(jobName(s.jobId))}</td><td class="num">${s.hours!=null?hf(s.hours)+" h":"…"}</td></tr>`).join("")}</tbody></table></div>`:`<div class="muted">Nothing yet this week.</div>`}</div>`;
  el.innerHTML=h;
  const on=$("clockOn");if(on)on.onclick=()=>clockOn($("cJob").value,on);
  const cs=$("cJob");if(cs)cs.onchange=()=>{S.pick=cs.value;renderClock()};
  const fs=$("findSite");if(fs)fs.onclick=findSite;
  const off=$("clockOff");if(off)off.onclick=()=>clockOff(o,off);
  bindCons(el);bindOpen(el);
}
setInterval(()=>{const e=$("elapsed"),o=myOpen();if(e&&o)e.textContent=elapsed(o.on)},20000);
async function findSite(){const b=$("findSite");b.disabled=true;b.textContent="Finding you…";const loc=await getLoc();b.disabled=false;b.textContent="📍 Find my site";
  if(!loc)return toast("Couldn't get your location. Turn on location for this app.",4000);
  const near=openJobs().filter(hasLoc).map(j=>({j,d:dist(loc,j)})).sort((a,b)=>a.d-b.d)[0];
  if(near&&near.d<=(+near.j.radius||300)){S.pick=near.j.id;renderClock();toast("You're at "+near.j.title)}
  else toast(near?`Nearest site is ${near.j.title}, ${(near.d/1000).toFixed(1)} km away. Pick the job yourself.`:"No sites have a location set yet. Pick the job yourself.",4500)}
async function clockOn(jobId,btn){
  if(!jobId)return toast("Pick a job first");if(myOpen())return;
  btn.disabled=true;btn.textContent="Getting location…";
  const loc=await getLoc(),j=job(jobId),now=new Date();
  try{await db.collection("shifts").add({business:BIZ,jobId,jobCode:j.code,site:j.site||j.title,who:S.me,email:myEmail(),date:ymd(now),on:now.toISOString(),off:null,hours:null,breakMin:0,onLoc:locInfo(loc,j),offLoc:null,note:"",createdAt:now.toISOString()});
    S.pick=null;toast("Clocked on at "+fmtT(now.toISOString()))}catch(e){fail(e);btn.disabled=false;btn.textContent="Clock on"}
}
async function clockOff(o,btn){
  btn.disabled=true;btn.textContent="Getting location…";
  const brk=Math.max(0,+$("brk").value||0),nt=$("cNote").value.trim();
  const loc=await getLoc(),now=new Date();
  const hrs=r2(Math.max(0,(now-new Date(o.on))/36e5-brk/60));
  try{await db.doc("shifts/"+o.id).update({off:now.toISOString(),hours:hrs,breakMin:brk,note:nt,offLoc:locInfo(loc,job(o.jobId)),updatedAt:now.toISOString()});
    toast(`Clocked off · ${hf(hrs)} h`);recompute(o.date)}catch(e){fail(e);btn.disabled=false;btn.textContent="Clock off"}

/* ---------- PHOTOS: thumbs in Firestore (photos/*); full size in Luke's Google Drive via drive-photos.gs,
   or in Firestore photoData/* if Drive isn't set up or can't be reached ---------- */
async function drive(body){const url=window.PHOTO_SCRIPT_URL;if(!url)throw new Error("no drive");
  const token=await S.user.getIdToken();const r=await fetch(url,{method:"POST",body:JSON.stringify({...body,token})});const j=await r.json();if(!j.ok)throw new Error(j.error||"drive failed");return j}
function photoPath(target,targetId,stage){if(target==="job"){const j=job(targetId)||{};return[`${j.code||""} ${j.title||""}`.trim(),stage[0].toUpperCase()+stage.slice(1)]}
  const x=S.fix.find(f=>f.id===targetId)||{};return["Repairs",`${String(x.at||new Date().toISOString()).slice(0,10)} ${x.item||targetId}`]}
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{res(i);setTimeout(()=>URL.revokeObjectURL(u),1000)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("bad image"))};i.src=u})}
function shrink(img,max,q){const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",q)}
async function addPhotos(files,target,targetId,stage,code){
  const list=[...files];if(!list.length)return;let n=0;toast(`Uploading ${list.length} photo${list.length>1?"s":""}…`,60000);
  for(const f of list){try{const img=await loadImg(f);let full=shrink(img,1600,.72);if(full.length>850000)full=shrink(img,1200,.6);if(full.length>950000)full=shrink(img,900,.55);
      const thumb=shrink(img,240,.6),id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),now=new Date();
      let driveId="";try{if(window.PHOTO_SCRIPT_URL)driveId=(await drive({action:"put",path:photoPath(target,targetId,stage),name:`${ymd(now)} ${pad(now.getHours())}${pad(now.getMinutes())} ${S.me} ${id}.jpg`,note:`${code||""} ${stage} by ${S.me}`,data:full})).id}catch(e){console.warn("drive",e)}
      const bt=db.batch();if(!driveId)bt.set(db.doc("photoData/"+id),{data:full});
      bt.set(db.doc("photos/"+id),{business:BIZ,target,targetId,jobCode:code||"",stage,thumb,driveId,w:img.naturalWidth,h:img.naturalHeight,who:S.me,email:myEmail(),date:ymd(now),at:now.toISOString(),caption:""});
      await bt.commit();n++}catch(e){console.warn(e)}}
  toast(n===list.length?`${n} photo${n>1?"s":""} saved`:`${n} of ${list.length} saved. Try the others again.`,3000)}
function photosOf(target,id,stage){return S.photos.filter(p=>p.target===target&&p.targetId===id&&(!stage||p.stage===stage)).sort((a,b)=>String(a.at).localeCompare(b.at))}
function photoGrid(target,id,stage,code,label){const ps=photosOf(target,id,stage);
  return`<div class="ph">${ps.map(p=>`<button type="button" class="th" data-ph="${esc(p.id)}" aria-label="Photo by ${esc(p.who)}"><img src="${p.thumb}" alt="" loading="lazy"></button>`).join("")}
  <label class="add"><span>📷</span>${esc(label||"Add")}<input type="file" accept="image/*" multiple data-up="${esc(target)}|${esc(id)}|${esc(stage)}|${esc(code||"")}"></label></div>`}
function bindPhotos(root){
  root.querySelectorAll("input[data-up]").forEach(i=>i.onchange=async()=>{const [tg,id,st,code]=i.dataset.up.split("|");const fs=[...i.files];i.value="";i.blur();await addPhotos(fs,tg,id,st,code)});
  root.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>viewPhoto(b.dataset.ph));
}
async function viewPhoto(id){const p=S.photos.find(x=>x.id===id);if(!p)return;
  const v=document.createElement("div");v.className="viewer";v.innerHTML=`<img src="${p.thumb}" alt=""><div class="small">${esc(p.stage)} · ${esc(p.who)} · ${fmtD(p.date)} ${fmtT(p.at)}</div>
  <div class="row" style="justify-content:center"><button class="btn small" id="pvX">Close</button>${isMgr()||p.email===myEmail()?`<button class="btn small danger" id="pvD">Delete</button>`:""}</div>`;
  document.body.appendChild(v);const close=()=>v.remove();v.onclick=e=>{if(e.target===v)close()};v.querySelector("#pvX").onclick=close;
  const d=v.querySelector("#pvD");if(d)d.onclick=async()=>{if(d.dataset.c!=="1"){d.dataset.c="1";d.textContent="Tap again to delete";return}try{await db.doc("photos/"+id).delete();if(p.driveId)drive({action:"del",id:p.driveId}).catch(()=>{});else await db.doc("photoData/"+id).delete();close();toast("Photo deleted")}catch(err){fail(err)}};
  try{let src="";if(p.driveId)src=(await drive({action:"get",id:p.driveId})).data;else{const s=await db.doc("photoData/"+id).get();if(s.exists)src=s.data().data}
    if(src&&v.isConnected)v.querySelector("img").src=src}catch(e){console.warn(e)}}

function selOpts(arr,cur){return arr.map(([k,l])=>`<option value="${k}" ${k===cur?"selected":""}>${l}</option>`).join("")}
function jobOpts(){return`<option value="">–</option>`+openJobs().map(j=>`<option value="${esc(j.id)}">${esc(j.code+" · "+j.title)}</option>`).join("")}
async function setField(col,id,d){try{await db.doc(col+"/"+id).update({...d,updatedAt:new Date().toISOString(),updatedBy:S.me})}catch(err){fail(err)}}
function bindDel(el,col){el.querySelectorAll(`[data-del-${col}]`).forEach(b=>b.onclick=async()=>{if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="Delete?";return}try{await db.doc(col+"/"+b.getAttribute("data-del-"+col)).delete()}catch(err){fail(err)}})}
const busy=el=>el.contains(document.activeElement)&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);

/* ---------- REPAIRS ---------- */
const FSTAT=[["reported","Reported"],["fixing","Being fixed"],["parts","Waiting on parts"],["fixed","Fixed"],["gone","Written off"]];
const FPILL={reported:"bad",fixing:"warn",parts:"warn",fixed:"ok",gone:""};
function renderFix(){const el=$("v-fix");if(busy(el))return;
  const open=S.fix.filter(x=>x.status!=="fixed"&&x.status!=="gone").sort((a,b)=>(b.down?1:0)-(a.down?1:0)||String(a.at).localeCompare(b.at));
  const done=S.fix.filter(x=>x.status==="fixed"||x.status==="gone").sort((a,b)=>String(b.updatedAt||b.at).localeCompare(a.updatedAt||a.at)).slice(0,20);
  const row=x=>`<div class="panel"><div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap"><div style="flex:1;min-width:0"><b style="font-size:15px">${esc(x.item)}</b>${x.down?` <span class="pill bad">can't use</span>`:""}<br><span class="muted small">${esc(x.who)} · ${fmtD(String(x.at).slice(0,10))}${x.jobCode?" · "+esc(x.jobCode):""}</span></div><span class="pill ${FPILL[x.status]||""}">${(FSTAT.find(s=>s[0]===x.status)||FSTAT[0])[1]}</span></div>
    ${x.problem?`<div style="white-space:pre-wrap">${esc(x.problem)}</div>`:""}${photoGrid("repair",x.id,"damage",x.jobCode,"Photo")}${x.fixNote?`<div class="small"><b>Fix:</b> ${esc(x.fixNote)}${x.cost?` · ${money2(x.cost)}`:""}</div>`:""}
    <div class="row"><select class="in" data-fst="${esc(x.id)}" style="flex:0 1 160px">${selOpts(FSTAT,x.status)}</select><input class="in" data-fnote="${esc(x.id)}" value="${esc(x.fixNote)}" placeholder="What was done / part needed" style="flex:1 1 150px;width:auto"><input class="in" data-fcost="${esc(x.id)}" type="number" step="0.01" min="0" value="${esc(x.cost||"")}" placeholder="$" style="flex:0 1 80px;width:auto"><button class="btn small" data-fsv="${esc(x.id)}">Save</button>
    ${x.status!=="fixed"?`<button class="btn small" data-f2b="${esc(x.id)}">🛒 Add part to buy list</button>`:""}${isMgr()?`<button class="btn small link danger" data-del-repairs="${esc(x.id)}">✕</button>`:""}</div></div>`;
  el.innerHTML=`<h2 class="v">Repairs</h2><div class="panel"><h3>Report broken gear</h3><form id="fF" class="grid2">
    <label class="f full">Tool / plant<input name="it" required placeholder="e.g. Diesel welder, 9&quot; grinder #2, crane truck remote"></label>
    <label class="f full">What's wrong<textarea name="problem" rows="2"></textarea></label>
    <label class="f">Job (optional)<select name="job">${jobOpts()}</select></label>
    <label class="f" style="flex-direction:row;align-items:center;gap:8px;text-transform:none;font-size:14px;color:var(--fg);font-weight:500"><input type="checkbox" name="down" style="width:20px;height:20px">Can't use it until fixed</label>
    <label class="f full">Photos of the damage<input name="pics" type="file" accept="image/*" multiple></label>
    <div class="full"><button class="btn primary" type="submit">Report</button></div></form></div>
    ${open.length?open.map(row).join(""):`<div class="panel muted">Nothing broken. Nice.</div>`}
    ${done.length?`<details><summary class="grp">Fixed / written off (${done.length})</summary>${done.map(row).join("")}</details>`:""}`;
  $("fF").onsubmit=async e=>{e.preventDefault();const f=e.target.elements,j=job(f.job.value);const d={business:BIZ,item:f.it.value.trim(),problem:f.problem.value.trim(),down:f.down.checked,jobId:j?j.id:"",jobCode:j?j.code:"",who:S.me,email:myEmail(),at:new Date().toISOString(),status:"reported",fixNote:"",cost:0};
    if(!d.item)return;const pics=[...f.pics.files];try{const ref=await db.collection("repairs").add(d);e.target.reset();toast("Reported");if(pics.length)await addPhotos(pics,"repair",ref.id,"damage",d.jobCode)}catch(err){fail(err)}};
  el.querySelectorAll("[data-fsv]").forEach(b=>b.onclick=()=>{const id=b.dataset.fsv,q=k=>el.querySelector(`[data-${k}="${CSS.escape(id)}"]`).value;const st=q("fst");
    setField("repairs",id,{status:st,fixNote:q("fnote").trim(),cost:r2(q("fcost")),...(st==="fixed"||st==="gone"?{down:false}:{})}).then(()=>toast("Saved"))});
  el.querySelectorAll("[data-f2b]").forEach(b=>b.onclick=async()=>{const x=S.fix.find(f=>f.id===b.dataset.f2b);if(!x)return;const part=el.querySelector(`[data-fnote="${CSS.escape(x.id)}"]`).value.trim();
    try{await db.collection("tobuy").add({business:BIZ,item:(part||"Part")+" for "+x.item,qty:1,unit:"",kind:"tool",urgency:x.down?"today":"week",jobId:x.jobId||"",jobCode:x.jobCode||"",supplier:"",estCost:0,who:S.me,email:myEmail(),at:new Date().toISOString(),status:"needed",repairId:x.id});
      await setField("repairs",x.id,{...(x.status==="reported"?{status:"parts"}:{}),...(part?{fixNote:part}:{})});toast("Added to To buy")}catch(err){fail(err)}});
  bindDel(el,"repairs");bindPhotos(el);
}

/* ---------- TO BUY ---------- */
const BKIND=[["consumable","Consumable"],["tool","Tool / gear"],["material","Material / steel"],["ppe","PPE"]];
const BURG=[["today","Need today"],["week","This week"],["whenever","Whenever"]];
const BSTAT=[["needed","Needed"],["ordered","Ordered"],["got","Got it"]];
function renderBuy(){const el=$("v-buy");if(busy(el))return;
  const ord={today:0,week:1,whenever:2};
  const open=S.buy.filter(x=>x.status!=="got").sort((a,b)=>(ord[a.urgency]??1)-(ord[b.urgency]??1)||String(a.at).localeCompare(b.at));
  const got=S.buy.filter(x=>x.status==="got").sort((a,b)=>String(b.updatedAt||b.at).localeCompare(a.updatedAt||a.at)).slice(0,25);
  const row=x=>`<div class="tk"><div><b>${esc(x.item)}</b>${x.qty&&x.qty!==1?` × ${esc(x.qty)}${esc(x.unit?" "+x.unit:"")}`:x.unit?` (${esc(x.unit)})`:""}<br><span class="muted small">${(BKIND.find(k=>k[0]===x.kind)||BKIND[0])[1]} · ${esc(x.who)}${x.jobCode?" · "+esc(x.jobCode):""}${x.supplier?" · "+esc(x.supplier):""}${x.estCost?" · ~"+money(x.estCost):""}</span></div>
    ${x.status!=="got"?`<span class="pill ${x.urgency==="today"?"bad":x.urgency==="week"?"warn":""}">${(BURG.find(u=>u[0]===x.urgency)||BURG[1])[1]}</span>`:""}
    <select class="in" data-bst="${esc(x.id)}" style="width:auto;flex:0 0 auto;padding:6px">${selOpts(BSTAT,x.status)}</select>${isMgr()||x.email===myEmail()?`<button class="btn small link danger" data-del-tobuy="${esc(x.id)}">✕</button>`:""}</div>`;
  const grp={};open.forEach(x=>(grp[x.status]=grp[x.status]||[]).push(x));
  el.innerHTML=`<h2 class="v">To buy</h2><div class="panel"><h3>Add to the list</h3><form id="bF" class="grid2">
    <label class="f full">What<input name="it" required placeholder="e.g. 3.2mm 7018 rods, 125mm flap discs, new grinder"></label>
    <label class="f">Qty<input name="qty" type="number" step="any" min="0" value="1" inputmode="decimal"></label>
    <label class="f">Unit<input name="unit" placeholder="box, kg, ea"></label>
    <label class="f">Type<select name="kind">${selOpts(BKIND,"consumable")}</select></label>
    <label class="f">How soon<select name="urg">${selOpts(BURG,"week")}</select></label>
    <label class="f">For job (optional)<select name="job">${jobOpts()}</select></label>
    <label class="f">Supplier (optional)<input name="sup" placeholder="e.g. Global Welding Supplies"></label>
    <div class="full"><button class="btn primary" type="submit">Add</button></div></form></div>
    ${open.length?["needed","ordered"].filter(s=>grp[s]).map(s=>`<div class="panel"><h3>${s==="needed"?"Needed":"Ordered"} (${grp[s].length})</h3>${grp[s].map(row).join("")}</div>`).join(""):`<div class="panel muted">Nothing on the list.</div>`}
    ${got.length?`<details><summary class="grp">Got it (${got.length})</summary><div class="panel">${got.map(row).join("")}</div></details>`:""}`;
  $("bF").onsubmit=async e=>{e.preventDefault();const f=e.target.elements,j=job(f.job.value);const d={business:BIZ,item:f.it.value.trim(),qty:+f.qty.value||1,unit:f.unit.value.trim(),kind:f.kind.value,urgency:f.urg.value,jobId:j?j.id:"",jobCode:j?j.code:"",supplier:f.sup.value.trim(),estCost:0,who:S.me,email:myEmail(),at:new Date().toISOString(),status:"needed"};
    if(!d.item)return;try{await db.collection("tobuy").add(d);e.target.reset();toast("Added")}catch(err){fail(err)}};
  el.querySelectorAll("[data-bst]").forEach(s=>s.onchange=()=>{s.blur();setField("tobuy",s.dataset.bst,{status:s.value}).then(()=>toast(s.value==="got"?"Ticked off":"Updated"))});
  bindDel(el,"tobuy");
}

/* ---------- MANAGER ---------- */
function renderMgr(){
  const el=$("v-mgr");if(el.contains(document.activeElement)&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  const w=S.mgrWeek,a=ymd(w),b=ymd(addDays(w,6));
  const sh=S.shifts.filter(s=>s.date>=a&&s.date<=b).sort((x,y)=>String(x.on).localeCompare(y.on));
  const co=S.cons.filter(c=>c.date>=a&&c.date<=b);
  const onNow=S.shifts.filter(s=>!s.off);
  const byWho={},byJob={};let tot=0;sh.forEach(s=>{const h=+s.hours||0;tot+=h;byWho[s.who]=(byWho[s.who]||0)+h;byJob[s.jobId]=(byJob[s.jobId]||0)+h});
  const cTot=co.reduce((t,c)=>t+(+c.cost||0),0),lc=+S.rates.labourCost||0;
  const offSite=sh.filter(s=>s.onLoc&&s.onLoc.onSite===false).length,noGps=sh.filter(s=>!s.onLoc||s.onLoc.none).length;
  el.innerHTML=dueBanner(S.tix,true)+`
  <div class="panel"><h3>On the clock now</h3>${onNow.length?onNow.map(s=>`<div class="mem"><div><b>${esc(s.who)}</b> · ${esc(jobName(s.jobId))}<br><span class="muted small">since ${fmtT(s.on)} ${fmtD(s.date)} (${elapsed(s.on)})</span></div>${locPill(s.onLoc)}</div>`).join(""):`<div class="muted">Nobody.</div>`}</div>

  <div class="toolbar"><button class="btn small" id="mPrev">‹</button><h2 class="v" style="margin:0;flex:1;text-align:center">Week of ${w.toLocaleDateString("en-AU",{day:"numeric",month:"short"})}</h2><button class="btn small" id="mNext">›</button></div>
  <div class="stats" style="margin-bottom:12px"><div class="stat"><b>${hf(tot)}</b><span>Hours</span></div><div class="stat"><b>${money(tot*lc)}</b><span>Labour cost</span></div><div class="stat"><b>${money(cTot)}</b><span>Consumables</span></div><div class="stat ${offSite?"bad":""}"><b>${offSite}${noGps?` / ${noGps}`:""}</b><span>Off site${noGps?" / no GPS":""}</span></div></div>

  <div class="panel"><h3>By person</h3><div class="tbl"><table><tbody>${Object.entries(byWho).sort((x,y)=>y[1]-x[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${hf(v)} h</td><td class="num">${money(v*lc)}</td></tr>`).join("")||`<tr><td class="muted">No hours.</td></tr>`}</tbody></table></div></div>

  <div class="panel"><h3>Jobs: expected vs actual (all time)</h3><div class="tbl"><table><thead><tr><th>Job</th><th class="num">Week</th><th class="num">Total / exp</th><th class="num">Consum.</th><th class="num">Quote</th><th class="num">Profit</th></tr></thead><tbody>${openJobs().map(j=>{const h=jobHrs(j.id),c=jobCons(j.id),m=S.money[j.id]||{};const rev=m.pricing==="hourly"?h*(+m.chargeRate||+S.rates.chargeRate||0)+c*(1+(+m.markup||0)/100):(+m.quote||0);const p=rev-h*lc-c;
    return`<tr><td><span class="code">${esc(j.code)}</span> ${esc(j.title)}</td><td class="num">${hf(byJob[j.id]||0)}</td><td class="num" style="${expHrs(j.id)&&h>expHrs(j.id)?"color:var(--bad)":""}">${hf(h)}${expHrs(j.id)?" / "+hf(expHrs(j.id)):""}</td><td class="num">${money(c)}</td><td class="num">${rev?money(rev):"–"}</td><td class="num" style="color:var(--${p>=0?"good":"bad"})">${rev?money(p):"–"}</td></tr>`}).join("")||`<tr><td class="muted">No open jobs.</td></tr>`}</tbody></table></div></div>

  <div class="panel"><div class="row" style="justify-content:space-between;align-items:center"><h3>Timesheets this week</h3><button class="btn small" id="csv">Download CSV</button></div>
    <div class="tbl"><table><thead><tr><th>Date</th><th>Who</th><th>Job</th><th>Time</th><th class="num">Hrs</th><th></th></tr></thead><tbody>${sh.map(s=>`<tr><td>${fmtD(s.date)}</td><td>${esc(s.who)}</td><td>${esc(s.jobCode)}</td><td>${fmtT(s.on)}–${s.off?fmtT(s.off):"now"}${s.breakMin?`<br><span class="muted small">${s.breakMin} min break</span>`:""}<br>${locPill(s.onLoc)}</td><td class="num">${s.hours!=null?hf(s.hours):"…"}</td><td><button class="btn small" data-fix="${esc(s.id)}">Fix</button></td></tr>`).join("")||`<tr><td colspan="6" class="muted">No hours this week.</td></tr>`}</tbody></table></div>
    <button class="btn small" id="addShift" style="align-self:flex-start">+ Add hours for someone</button></div>

  <div class="panel"><h3>Rates</h3><form id="rF" class="row">
    <label class="f">Labour cost $/h (wages + super + on-costs)<input name="labourCost" type="number" step="0.5" min="0" value="${esc(S.rates.labourCost||"")}"></label>
    <label class="f">Default charge rate $/h<input name="chargeRate" type="number" step="0.5" min="0" value="${esc(S.rates.chargeRate||"")}"></label>
    <button class="btn primary" type="submit">Save</button></form></div>

  <div class="panel"><h3>Crew access</h3>
    ${S.reqs.length?`<div class="grp">Asking to join</div>`+S.reqs.map(r=>`<div class="mem"><div><b>${esc(r.name||r.email)}</b><br><span class="small muted">${esc(r.email)}</span></div><input class="in" data-rn="${esc(r.id)}" value="${esc((r.name||"").split(" ")[0])}" style="flex:0 1 120px" aria-label="Name on the board"><button class="btn small go" data-acc="crew" data-id="${esc(r.id)}">Let in</button><button class="btn small" data-acc="manager" data-id="${esc(r.id)}">As manager</button><button class="btn small" data-acc="no" data-id="${esc(r.id)}">Ignore</button></div>`).join(""):`<div class="muted small">No one waiting. New crew open the app, sign in with Google, and show up here.</div>`}
    ${Object.entries(S.access).sort((x,y)=>(x[1].name||"").localeCompare(y[1].name||"")).map(([em,x])=>`<div class="mem"><div><b>${esc(x.name)}</b> · ${x.role==="manager"?"Manager":"Crew"}<br><span class="small muted">${esc(em)}</span></div>${OWNERS.includes(em)?"":`<select class="in" data-role="${esc(em)}" style="flex:0 1 120px"><option value="crew" ${x.role!=="manager"?"selected":""}>Crew</option><option value="manager" ${x.role==="manager"?"selected":""}>Manager</option></select><button class="btn small danger" data-rmm="${esc(em)}">Remove</button>`}</div>`).join("")}
  </div>

  <div class="panel"><h3>Xero reports</h3><div class="muted">Coming next: invoices, bills and profit by job from Xero, and the owner dashboard. Daily totals are already being saved for it.</div></div>`;
  $("mPrev").onclick=()=>{S.mgrWeek=addDays(S.mgrWeek,-7);renderMgr()};$("mNext").onclick=()=>{S.mgrWeek=addDays(S.mgrWeek,7);renderMgr()};
  el.querySelectorAll("[data-fix]").forEach(b=>b.onclick=()=>shiftSheet(b.dataset.fix));
  $("addShift").onclick=()=>shiftSheet("");
  $("csv").onclick=()=>{const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
    const L=[["Date","Worker","Business","Job code","Site","Clock on","Clock off","Break min","Hours","On site","Note"].join(",")].concat(sh.map(s=>[s.date,s.who,s.business||BIZ,s.jobCode,s.site,s.on?hm(s.on):"",s.off?hm(s.off):"",s.breakMin||0,s.hours??"",s.onLoc&&s.onLoc.onSite===true?"yes":s.onLoc&&s.onLoc.onSite===false?"no":"",s.note].map(q).join(",")));
    const u=URL.createObjectURL(new Blob([L.join("\n")],{type:"text/csv"}));const x=document.createElement("a");x.href=u;x.download=`tws-timesheet-${a}.csv`;document.body.appendChild(x);x.click();x.remove()};
  $("rF").onsubmit=async e=>{e.preventDefault();try{await db.doc("money/_rates").set({labourCost:r2(e.target.elements.labourCost.value),chargeRate:r2(e.target.elements.chargeRate.value)});toast("Rates saved")}catch(err){fail(err)}};
  const ref=db.doc("access/members");
  el.querySelectorAll("[data-acc]").forEach(b=>b.onclick=async()=>{const r=S.reqs.find(x=>x.id===b.dataset.id);if(!r)return;
    try{if(b.dataset.acc!=="no"){const nm=(el.querySelector(`[data-rn="${CSS.escape(r.id)}"]`)||{}).value||r.name||r.email;await ref.set({members:{[r.email.toLowerCase()]:{name:nm.trim(),role:b.dataset.acc}}},{merge:true});
      for(const x of S.tix.filter(x=>x.who===nm.trim()&&!x.email))await db.doc("tickets/"+x.id).update({email:r.email.toLowerCase()}).catch(()=>{})}
      await db.doc("requests/"+r.id).delete();toast(b.dataset.acc==="no"?"Ignored":"Let in")}catch(err){fail(err)}});
  el.querySelectorAll("[data-role]").forEach(s=>s.onchange=async()=>{const m={...S.access};m[s.dataset.role]={...m[s.dataset.role],role:s.value};try{await ref.set({members:m})}catch(err){fail(err)}});
  el.querySelectorAll("[data-rmm]").forEach(b=>b.onclick=async()=>{if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="Tap again";return}const m={...S.access};delete m[b.dataset.rmm];try{await ref.set({members:m})}catch(err){fail(err)}});
}
function shiftSheet(id){
  const s=id?S.shifts.find(x=>x.id===id):{date:ymd(new Date()),who:"",jobId:"",breakMin:30};if(!s)return;
  $("sheetRoot").innerHTML=`<div class="scrim" id="scrim"></div><aside class="sheet" role="dialog" aria-label="Fix hours"><div class="shead"><div><div class="code">${id?"Fix hours":"Add hours"}</div><h2>${esc(s.who||"Hours")}</h2></div><button class="btn small" id="xS">Close</button></div>
  <div class="panel"><form id="sF" class="grid2">
    <label class="f">Who<select name="who" required>${people().map(p=>`<option ${p===s.who?"selected":""}>${esc(p)}</option>`).join("")}</select></label>
    <label class="f">Date<input name="date" type="date" required value="${esc(s.date)}"></label>
    <label class="f full">Job<select name="job" required><option value="">Choose job…</option>${S.jobs.map(j=>`<option value="${esc(j.id)}" ${j.id===s.jobId?"selected":""}>${esc(j.code+" · "+j.title)}</option>`).join("")}</select></label>
    <label class="f">Clock on<input name="on" type="time" required value="${s.on?hm(s.on):"07:00"}"></label>
    <label class="f">Clock off<input name="off" type="time" required value="${s.off?hm(s.off):"15:30"}"></label>
    <label class="f">Unpaid break (min)<input name="brk" type="number" min="0" step="5" value="${esc(s.breakMin||0)}"></label>
    <label class="f">Note<input name="note" value="${esc(s.note)}"></label>
    <div class="full row" style="justify-content:space-between"><button class="btn primary" type="submit">Save</button>${id?`<button class="btn danger" type="button" id="delS">Delete</button>`:""}</div>
  </form></div></aside>`;
  $("scrim").onclick=closeSheet;$("xS").onclick=closeSheet;S.open=null;
  $("sF").onsubmit=async e=>{e.preventDefault();const f=e.target,j=job(f.elements.job.value);if(!j)return;
    const on=new Date(f.elements.date.value+"T"+f.elements.on.value);let off=new Date(f.elements.date.value+"T"+f.elements.off.value);if(off<=on)off=addDays(off,1);
    const brk=+f.elements.brk.value||0,hrs=r2(Math.max(0,(off-on)/36e5-brk/60));
    const who=f.elements.who.value,em=Object.keys(S.access).find(k=>S.access[k].name===who)||(who===S.me?myEmail():(s.email||""));
    const d={business:BIZ,jobId:j.id,jobCode:j.code,site:j.site||j.title,who,email:em,date:f.elements.date.value,on:on.toISOString(),off:off.toISOString(),hours:hrs,breakMin:brk,note:f.elements.note.value.trim(),edited:{by:S.me,at:new Date().toISOString()}};
    try{if(id){const {id:_x,...rest}=s;await db.doc("shifts/"+id).set({...rest,...d})}else{d.onLoc={none:true,manual:true};d.offLoc=null;d.createdAt=new Date().toISOString();await db.collection("shifts").add(d)}
      recompute(d.date);if(id&&s.date!==d.date)recompute(s.date);closeSheet();toast("Hours saved")}catch(err){fail(err)}};
  const ds=$("delS");if(ds)ds.onclick=async()=>{if(ds.dataset.c!=="1"){ds.dataset.c="1";ds.textContent="Tap again to delete";return}try{await db.doc("shifts/"+id).delete();recompute(s.date);closeSheet();toast("Deleted")}catch(err){fail(err)}};
}

/* ============ sign-in + access (same as Charlie's Crew Board) ============ */
function gate(msg,showOut){$("app").hidden=true;$("gate").hidden=false;$("gateMsg").textContent=msg;$("signIn").hidden=!!showOut||!!S.user;$("gateOut").hidden=!showOut}
$("signIn").onclick=()=>{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
  auth.signInWithPopup(p).catch(e=>{const c=(e&&e.code)||"";if(/popup-closed|cancelled-popup/.test(c))return;$("gateMsg").innerHTML="Sign-in got blocked. Open this link in <b>Chrome</b> or <b>Safari</b> (not inside WhatsApp, Messenger or email), then try again."+(c?"<br><small>("+esc(c)+")</small>":"")})};
$("gateOut").onclick=$("signOut").onclick=e=>{e.preventDefault();auth.signOut()};
let retry=null;
function watchAccess(u){
  subs.push(db.doc("access/members").onSnapshot(s=>{S.access=(s.exists&&s.data().members)||{};applyAccess()},
    ()=>{if(isOwner()){S.access={};applyAccess();return}
      stopData();S.me=null;
      db.doc("requests/"+u.uid).set({email:(u.email||"").toLowerCase(),name:u.displayName||"",at:new Date().toISOString()}).catch(()=>{});
      gate("Thanks "+((u.displayName||"").split(" ")[0]||"")+"! Luke needs to let you onto the crew. Once he does, this opens by itself.",true);
      clearTimeout(retry);retry=setTimeout(()=>{if(S.user===u&&!S.me)watchAccess(u)},20000)}));
}
function applyAccess(){
  const em=myEmail(),m=S.access[em];
  if(isOwner()){S.me=(m&&m.name)||"Luke";S.role="manager"}
  else if(m){S.me=m.name;S.role=m.role||"crew"}
  else{stopData();S.me=null;db.doc("requests/"+S.user.uid).set({email:em,name:S.user.displayName||"",at:new Date().toISOString()}).catch(()=>{});
    gate("Thanks "+((S.user.displayName||"").split(" ")[0]||"")+"! Luke needs to let you onto the crew. Once he does, this opens by itself.",true);return}
  $("gate").hidden=true;$("app").hidden=false;$("meName").textContent=S.me+(isMgr()?" · manager":"");
  startData();let v=S.view;try{v=localStorage.getItem("tws-view")||v}catch(e){}show(v);
}
auth.onAuthStateChanged(u=>{subs.forEach(f=>{try{f()}catch(e){}});subs=[];stopData();closeSheet();S.user=u;S.me=null;S.role=null;S.access={};S.reqs=[];S.money={};S.rates={labourCost:0,chargeRate:0};S.tix=[];S.ideas=[];S.fix=[];S.buy=[];S.photos=[];S.jobs=[];S.shifts=[];S.cons=[];S.cal=[];S.loaded={};S.seeded=false;
  if(!u){gate("Total Welding Solutions crew only. Sign in with your Google account.",false);return}
  gate("Checking you're on the crew…",false);watchAccess(u);
});

/* ============ data ============ */
let dataSubs=[],calSub=null,started=false;
function stopData(){dataSubs.forEach(f=>{try{f()}catch(e){}});dataSubs=[];if(calSub){calSub();calSub=null}started=false}
function startData(){
  if(started)return;started=true;
  const on=(q,f)=>dataSubs.push(q.onSnapshot(f,e=>{console.warn(e);note("Lost connection to the board. Reopen the app to reconnect.")}));
  const since=ymd(addDays(new Date(),-120));
  const tm=setTimeout(()=>{if(!S.loaded.jobs)note("Can't reach the board yet. Check your signal.")},10000);
  on(db.collection("jobs"),s=>{S.jobs=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache){S.loaded.jobs=true;clearTimeout(tm);note("");seed()}render()});
  on(db.collection("shifts").where("date",">=",since),s=>{S.shifts=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  on(db.collection("consumables").where("date",">=",since),s=>{S.cons=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  watchCal();
  on(db.collection("photos"),s=>{S.photos=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  on(db.collection("repairs"),s=>{S.fix=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  on(db.collection("tobuy"),s=>{S.buy=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  on(db.collection("ideas"),s=>{S.ideas=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  on(isMgr()?db.collection("tickets"):db.collection("tickets").where("email","==",myEmail()),s=>{S.tix=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  if(isMgr()){
    on(db.collection("requests"),s=>{S.reqs=s.docs.map(d=>({id:d.id,...d.data()}));render()});
    on(db.collection("money"),s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.rates=o._rates||{labourCost:0,chargeRate:0};delete o._rates;S.money=o;render()});
  }
}
function watchCal(){if(!started)return;if(calSub)calSub();const a=ymd(addDays(S.calWeek,-7));
  calSub=db.collection("calendar").where("date",">=",a).onSnapshot(s=>{S.cal=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.warn(e))}
// First run: bring across the two jobs from the old Claude Job Board
async function seed(){
  if(S.seeded||!isOwner()||S.jobs.length)return;S.seeded=true;
  const now=new Date().toISOString();
  for(const [code,title] of [["TWS-0001","Curtis Ferry"],["TWS-0002","East Coast"]])
    await db.doc("jobs/"+code.toLowerCase()).set({code,business:BIZ,title,site:title,client:"",address:"",contactName:"",contactPhone:"",status:"Active",start:"",end:"",crew:[],plan:[],notes:"",lat:null,lng:null,radius:300,createdAt:"2026-11-02T09:00:00.000Z",updatedAt:now}).catch(()=>{});
}
try{const v=localStorage.getItem("tws-view");if(v)S.view=v}catch(e){}
show(S.view);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
